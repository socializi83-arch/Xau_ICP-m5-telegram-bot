services:
    - type: web
    name: xau-m5-auto-telegram
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: TELEGRAM_TOKEN
        sync: false
            - key: CHAT_ID
        sync: false
